# ======================
# Font (req Nerd Font) =
#=======================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

#==============================
# Appearance and Transparency =
#==============================
background_opacity 0.75
background_blur 1
window_padding_width 12
hide_window_decorations yes

#================
# Color palette =
#================
background #0a0e17
foreground #c0caf5
selection_background #33ccff
selection_foreground #0a0e17
cursor #00ff99
cursor_text_color #0a0e17

#basic colors
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #3d59a1
color5 #bb9af7
color6 #2ac3de
color7 #c0caf5
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #3d59a1
color13 #bb9af7
color14 #2ac3de
color15 #c0caf5

#===================
# Kittens advanced =
#===================
allow_remote_control yes
listen_on unix:/tmp/mykitty
mouse_map left click ungrabbed no-op

#=================
# Scroll History =
#=================
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0
background {
    monitor = 
    path = ~/.config/hypr/wallpapers/dev_backgroud.png
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(15, 15, 15)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = dots_center
    valign = center
}

label {
    monitor = 
    text = $TIME
    font_size = 64
    font_family = JestBrains Mono Nerd Font 
    position = 0, 80
    halign = center
    valign = center
}